<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamorphic Testing Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --base-bg: #0a0a0a;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #888888;
            --accent: #4a9eff;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--base-bg);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 0.875rem;
        }

        select {
            width: 100%;
            background: var(--base-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.625rem 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover {
            border-color: var(--accent);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select:focus {
            border-color: var(--accent);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .metric-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .model-card {
            background: var(--base-bg);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 1.25rem;
            transition: all 0.2s;
        }

        .model-card.best {
            border-color: var(--accent);
        }

        .model-card.worst {
            opacity: 0.5;
        }

        .model-name {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .primary-metric {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 500;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detailed-metrics {
            margin-top: 2rem;
        }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
        }

        .metrics-table th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .metrics-table td {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .metrics-table tr:last-child td {
            border-bottom: none;
        }

        .metrics-table td.best {
            color: var(--accent);
            font-weight: 500;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
                gap: 1.5rem;
            }

            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Metamorphic Testing Results</h1>
            <p class="subtitle">Compare YOLO model performance across transformations</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <span class="control-label">Models</span>
                <div class="checkbox-group" id="modelCheckboxes"></div>
            </div>
            <div class="control-group">
                <span class="control-label">Metamorphic Test</span>
                <select id="testSelector">
                    <option value="">Loading tests...</option>
                </select>
            </div>
            <div class="control-group">
                <span class="control-label">Comparison Type</span>
                <select id="comparisonSelector">
                    <option value="original_vs_transformed">Original vs Transformed</option>
                    <option value="transformed_vs_gt">Transformed vs Ground Truth</option>
                    <option value="original_vs_gt">Original vs Ground Truth</option>
                </select>
            </div>
        </div>

        <div class="results" id="results">
            <div class="no-data">Select models and a test to view results</div>
        </div>
    </div>

    <script>
        // Configuration
        const RESULTS_BASE_PATH = '/analysis/results';
        const METRICS = ['AP', 'AP50', 'AP75', 'APs', 'APm', 'APl', 'AR1', 'AR10', 'AR100', 'ARs', 'ARm', 'ARl'];

        // State
        let availableModels = [];
        let availableTests = [];
        let selectedModels = [];
        let selectedTest = '';
        let selectedComparison = 'original_vs_transformed';
        let cachedData = {};

        // Initialize dashboard
        async function init() {
            await discoverModelsAndTests();
            renderModelCheckboxes();
            renderTestSelector();

            // Set up comparison selector
            const comparisonSelector = document.getElementById('comparisonSelector');
            comparisonSelector.onchange = handleComparisonChange;

            // Select all models by default
            selectedModels = [...availableModels];
            availableModels.forEach(model => {
                document.getElementById(`model-${model}`).checked = true;
            });

            // Select first test by default
            if (availableTests.length > 0) {
                selectedTest = availableTests[0];
                document.getElementById('testSelector').value = selectedTest;
                await updateResults();
            }
        }

        // Discover available models and tests from directory structure
        async function discoverModelsAndTests() {
            try {
                // In a real implementation, this would require a backend API
                // For now, we'll use a manifest approach or fallback to hardcoded discovery

                // Attempt to load from a manifest file if it exists
                try {
                    const manifestResponse = await fetch('/dashboard/manifest.json');
                    if (manifestResponse.ok) {
                        const manifest = await manifestResponse.json();
                        availableModels = manifest.models;
                        availableTests = manifest.tests;
                        return;
                    }
                } catch (e) {
                    // Manifest doesn't exist, fall through to discovery
                }

                // Fallback: discover by trying to load known structure
                const knownModels = ['yolov5', 'yolov8', 'yolov12'];
                const knownTests = [
                    'imgGrayscale',
                    'imgMotionBlur',
                    'imgStretch',
                    'imgResolution',
                    'imgColorWheel',
                    'imgDarkBright',
                    'labelRemove_avg',
                    'labelRemove_black',
                    'labelRemove_white'
                ];

                // Test which models actually have data
                for (const model of knownModels) {
                    for (const test of knownTests) {
                        try {
                            const response = await fetch(`${RESULTS_BASE_PATH}/${model}/${test}/original_vs_transformed/stats.json`);
                            if (response.ok) {
                                if (!availableModels.includes(model)) {
                                    availableModels.push(model);
                                }
                                if (!availableTests.includes(test)) {
                                    availableTests.push(test);
                                }
                            }
                        } catch (e) {
                            // File doesn't exist, continue
                        }
                    }
                }

                availableModels.sort();
                availableTests.sort();

            } catch (error) {
                console.error('Error discovering models and tests:', error);
            }
        }

        // Render model checkboxes
        function renderModelCheckboxes() {
            const container = document.getElementById('modelCheckboxes');
            container.innerHTML = availableModels.map(model => `
                <div class="checkbox-item">
                    <input type="checkbox" id="model-${model}" value="${model}" onchange="handleModelChange()">
                    <label for="model-${model}">${model}</label>
                </div>
            `).join('');
        }

        // Render test selector
        function renderTestSelector() {
            const selector = document.getElementById('testSelector');
            selector.innerHTML = availableTests.map(test =>
                `<option value="${test}">${formatTestName(test)}</option>`
            ).join('');
            selector.onchange = handleTestChange;
        }

        // Format test name for display
        function formatTestName(test) {
            return test
                .replace(/([A-Z])/g, ' $1')
                .replace(/_/g, ' ')
                .trim()
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Get comparison type display name
        function getComparisonName() {
            const names = {
                'original_vs_transformed': 'Original vs Transformed',
                'transformed_vs_gt': 'Transformed vs Ground Truth',
                'original_vs_gt': 'Original vs Ground Truth'
            };
            return names[selectedComparison] || selectedComparison;
        }

        // Handle model selection change
        function handleModelChange() {
            selectedModels = availableModels.filter(model =>
                document.getElementById(`model-${model}`).checked
            );
            updateResults();
        }

        // Handle test selection change
        function handleTestChange(event) {
            selectedTest = event.target.value;
            updateResults();
        }

        // Handle comparison type change
        function handleComparisonChange(event) {
            selectedComparison = event.target.value;

            // For original_vs_gt, disable test selector since it's not needed
            const testSelector = document.getElementById('testSelector');
            if (selectedComparison === 'original_vs_gt') {
                testSelector.disabled = true;
            } else {
                testSelector.disabled = false;
            }

            updateResults();
        }

        // Load data for a specific model and test
        async function loadData(model, test, comparison) {
            const cacheKey = `${model}:${test}:${comparison}`;

            if (cachedData[cacheKey]) {
                return cachedData[cacheKey];
            }

            try {
                // Handle original_vs_gt specially as it's at model level, not test level
                let url;
                if (comparison === 'original_vs_gt') {
                    url = `${RESULTS_BASE_PATH}/${model}/original_vs_gt/stats.json`;
                } else {
                    url = `${RESULTS_BASE_PATH}/${model}/${test}/${comparison}/stats.json`;
                }

                const response = await fetch(url);
                if (!response.ok) return null;

                const data = await response.json();
                cachedData[cacheKey] = data;
                return data;
            } catch (error) {
                console.error(`Error loading data for ${model}/${test}/${comparison}:`, error);
                return null;
            }
        }

        // Update results display
        async function updateResults() {
            // For original_vs_gt, test selection is not required
            if (selectedModels.length === 0 || (!selectedTest && selectedComparison !== 'original_vs_gt')) {
                document.getElementById('results').innerHTML = '<div class="no-data">Select models and a test to view results</div>';
                return;
            }

            // Load data for all selected models
            const dataPromises = selectedModels.map(model =>
                loadData(model, selectedTest, selectedComparison).then(data => ({ model, data }))
            );

            const results = await Promise.all(dataPromises);
            const validResults = results.filter(r => r.data !== null);

            if (validResults.length === 0) {
                document.getElementById('results').innerHTML = '<div class="no-data">No data available for selected combination</div>';
                return;
            }

            renderResults(validResults);
        }

        // Render results
        function renderResults(results) {
            const container = document.getElementById('results');
            const comparisonName = getComparisonName();
            const testInfo = selectedComparison === 'original_vs_gt' ? '' : ` — ${formatTestName(selectedTest)}`;

            // Primary metric comparison (AP)
            const primarySection = `
                <div class="metric-section">
                    <div class="section-title">Average Precision (AP) — ${comparisonName}${testInfo}</div>
                    <div class="comparison-grid">
                        ${renderPrimaryMetrics(results)}
                    </div>
                </div>
            `;

            // Detailed metrics table
            const detailedSection = `
                <div class="metric-section">
                    <div class="section-title">Detailed Metrics</div>
                    ${renderDetailedTable(results)}
                </div>
            `;

            container.innerHTML = primarySection + detailedSection;
        }

        // Render primary metric cards
        function renderPrimaryMetrics(results) {
            const apValues = results.map(r => r.data.AP);
            const maxAP = Math.max(...apValues);
            const minAP = Math.min(...apValues);

            return results.map(({ model, data }) => {
                const isBest = data.AP === maxAP && results.length > 1;
                const isWorst = data.AP === minAP && results.length > 1 && maxAP !== minAP;
                const cardClass = isBest ? 'best' : (isWorst ? 'worst' : '');

                return `
                    <div class="model-card ${cardClass}">
                        <div class="model-name">${model}</div>
                        <div class="primary-metric">${data.AP.toFixed(3)}</div>
                        <div class="metric-label">Average Precision</div>
                    </div>
                `;
            }).join('');
        }

        // Render detailed metrics table
        function renderDetailedTable(results) {
            const rows = METRICS.map(metric => {
                const values = results.map(r => r.data[metric]);
                const maxValue = Math.max(...values);

                const cells = results.map(({ model, data }) => {
                    const value = data[metric];
                    const isBest = value === maxValue && results.length > 1;
                    return `<td class="${isBest ? 'best' : ''}">${value.toFixed(3)}</td>`;
                }).join('');

                return `
                    <tr>
                        <td style="color: var(--text-secondary)">${metric}</td>
                        ${cells}
                    </tr>
                `;
            }).join('');

            const headers = results.map(r => `<th>${r.model}</th>`).join('');

            return `
                <div class="detailed-metrics">
                    <table class="metrics-table">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                ${headers}
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
