<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Metamorphic Testing Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 30px 40px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .content {
            padding: 40px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 2em;
            font-weight: 700;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-wrapper {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chart-wrapper h3 {
            margin-bottom: 20px;
            color: #495057;
            font-size: 1.3em;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        canvas {
            max-height: 400px;
        }

        .model-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 8px;
        }

        .badge-yolov5 {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-yolov8 {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-yolov12 {
            background: #e8f5e9;
            color: #388e3c;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .comparison-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .comparison-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .comparison-table tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #6c757d;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
            border-left: 4px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>YOLO Metamorphic Testing Dashboard</h1>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="transformSelect">Transformation</label>
                <select id="transformSelect">
                    <optgroup label="Image Transformations">
                        <option value="imgColorWheel">Color Wheel</option>
                        <option value="imgDarkBright">Dark/Bright</option>
                        <option value="imgGrayscale">Grayscale</option>
                        <option value="imgMotionBlur">Motion Blur</option>
                        <option value="imgResolution">Resolution</option>
                        <option value="imgStretch">Stretch</option>
                    </optgroup>
                    <optgroup label="Label Transformations">
                        <option value="labelRemove_black">Label Remove (Black)</option>
                        <option value="labelRemove_white">Label Remove (White)</option>
                        <option value="labelRemove_avg">Label Remove (Average)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group">
                <label for="metricSelect">Primary Metric</label>
                <select id="metricSelect">
                    <option value="AP">AP (Average Precision)</option>
                    <option value="AP50">AP50</option>
                    <option value="AP75">AP75</option>
                    <option value="AR1">AR@1</option>
                    <option value="AR10">AR@10</option>
                    <option value="AR100">AR@100</option>
                </select>
            </div>

            <div class="control-group">
                <label for="viewSelect">View Mode</label>
                <select id="viewSelect">
                    <option value="single">Single Transformation</option>
                    <option value="all">All Transformations</option>
                </select>
            </div>
        </div>

        <div class="content">
            <div id="loadingMessage" class="loading">Loading data...</div>
            <div id="errorMessage" class="error" style="display: none;"></div>

            <div id="dashboardContent" style="display: none;">
                <!-- Metrics Cards -->
                <div class="metrics-grid" id="metricsGrid"></div>

                <!-- Charts -->
                <div class="charts-container">
                    <div class="chart-wrapper full-width">
                        <h3>Original vs Transformed Performance (Ground Truth)</h3>
                        <canvas id="originalVsTransformedChart"></canvas>
                    </div>

                    <div class="chart-wrapper">
                        <h3>Model Comparison (Metamorphic)</h3>
                        <canvas id="comparisonChart"></canvas>
                    </div>

                    <div class="chart-wrapper">
                        <h3>Precision Metrics</h3>
                        <canvas id="precisionChart"></canvas>
                    </div>

                    <div class="chart-wrapper full-width">
                        <h3>Comprehensive Metrics Comparison</h3>
                        <canvas id="radarChart"></canvas>
                    </div>

                    <div class="chart-wrapper full-width">
                        <h3>Cross-Transformation Performance</h3>
                        <canvas id="allTransformsChart"></canvas>
                    </div>
                </div>

                <!-- Comparison Table -->
                <div class="chart-wrapper">
                    <h3>Detailed Metrics Table</h3>
                    <table class="comparison-table" id="comparisonTable"></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MODELS = ['yolov5', 'yolov8', 'yolov12'];
        const TRANSFORMATIONS = [
            'imgColorWheel', 'imgDarkBright', 'imgGrayscale',
            'imgMotionBlur', 'imgResolution', 'imgStretch',
            'labelRemove_black', 'labelRemove_white', 'labelRemove_avg'
        ];
        const METRICS = ['AP', 'AP50', 'AP75', 'APs', 'APm', 'APl', 'AR1', 'AR10', 'AR100', 'ARs', 'ARm', 'ARl'];

        const MODEL_COLORS = {
            'yolov5': 'rgb(25, 118, 210)',
            'yolov8': 'rgb(123, 31, 162)',
            'yolov12': 'rgb(56, 142, 60)'
        };

        let allData = {};
        let originalVsGtData = {};  // Baseline performance
        let transformedVsGtData = {};  // Actual performance on transformed images
        let charts = {};

        // Load all data
        async function loadAllData() {
            try {
                for (const model of MODELS) {
                    allData[model] = {};
                    originalVsGtData[model] = {};
                    transformedVsGtData[model] = {};

                    // Load original vs GT (baseline performance)
                    const origGtPath = `results/${model}/original_vs_gt/stats.json`;
                    const origGtResponse = await fetch(origGtPath);
                    if (origGtResponse.ok) {
                        originalVsGtData[model] = await origGtResponse.json();
                    } else {
                        console.warn(`Could not load ${origGtPath}`);
                    }

                    for (const transform of TRANSFORMATIONS) {
                        // Load metamorphic metrics (original detections vs transformed detections)
                        const path = `results/${model}/${transform}/original_vs_transformed/stats.json`;
                        const response = await fetch(path);
                        if (response.ok) {
                            allData[model][transform] = await response.json();
                        } else {
                            console.warn(`Could not load ${path}`);
                        }

                        // Load transformed vs GT (actual performance on transformed images)
                        const transformGtPath = `results/${model}/${transform}/transformed_vs_gt/stats.json`;
                        const transformGtResponse = await fetch(transformGtPath);
                        if (transformGtResponse.ok) {
                            transformedVsGtData[model][transform] = await transformGtResponse.json();
                        } else {
                            console.warn(`Could not load ${transformGtPath}`);
                        }
                    }
                }

                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                updateDashboard();
            } catch (error) {
                showError(`Error loading data: ${error.message}`);
            }
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
        }

        function updateDashboard() {
            const transform = document.getElementById('transformSelect').value;
            const metric = document.getElementById('metricSelect').value;
            const viewMode = document.getElementById('viewSelect').value;

            if (viewMode === 'single') {
                updateMetricsCards(transform);
                updateOriginalVsTransformedChart(transform, metric);
                updateComparisonChart(transform, metric);
                updatePrecisionChart(transform);
                updateRadarChart(transform);
                document.querySelector('.charts-container').style.display = 'grid';
            } else {
                updateAllTransformsChart(metric);
                document.querySelector('.charts-container').style.display = 'block';
            }

            updateTable(transform);
        }

        function updateMetricsCards(transform) {
            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = '';

            MODELS.forEach(model => {
                const metamorphicData = allData[model][transform];
                const originalGt = originalVsGtData[model];
                const transformedGt = transformedVsGtData[model][transform];

                // Card 1: Original vs GT (Baseline)
                if (originalGt) {
                    const card1 = document.createElement('div');
                    card1.className = 'metric-card';
                    card1.style.background = 'linear-gradient(135deg, #43a047 0%, #1b5e20 100%)';
                    card1.innerHTML = `
                        <div class="metric-label">${model.toUpperCase()} - Original AP</div>
                        <div class="metric-value">${(originalGt.AP * 100).toFixed(1)}%</div>
                        <div style="font-size: 0.75em; opacity: 0.9; margin-top: 4px;">vs Ground Truth</div>
                    `;
                    grid.appendChild(card1);
                }

                // Card 2: Transformed vs GT (Actual Performance)
                if (transformedGt) {
                    const card2 = document.createElement('div');
                    card2.className = 'metric-card';
                    card2.style.background = 'linear-gradient(135deg, #fb8c00 0%, #e65100 100%)';
                    card2.innerHTML = `
                        <div class="metric-label">${model.toUpperCase()} - Transformed AP</div>
                        <div class="metric-value">${(transformedGt.AP * 100).toFixed(1)}%</div>
                        <div style="font-size: 0.75em; opacity: 0.9; margin-top: 4px;">vs Ground Truth</div>
                    `;
                    grid.appendChild(card2);
                }

                // Card 3: Performance Drop
                if (originalGt && transformedGt) {
                    const drop = (originalGt.AP - transformedGt.AP) * 100;
                    const card3 = document.createElement('div');
                    card3.className = 'metric-card';
                    card3.style.background = drop > 5 ? 'linear-gradient(135deg, #e53935 0%, #b71c1c 100%)'
                                                       : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    card3.innerHTML = `
                        <div class="metric-label">${model.toUpperCase()} - AP Drop</div>
                        <div class="metric-value">${drop > 0 ? '-' : '+'}${Math.abs(drop).toFixed(1)}%</div>
                        <div style="font-size: 0.75em; opacity: 0.9; margin-top: 4px;">${transform}</div>
                    `;
                    grid.appendChild(card3);
                }
            });
        }

        function updateOriginalVsTransformedChart(transform, metric) {
            const ctx = document.getElementById('originalVsTransformedChart');

            const datasets = [];

            // Original performance (vs GT)
            datasets.push({
                label: 'Original (vs GT)',
                data: MODELS.map(model => {
                    const data = originalVsGtData[model];
                    return data ? data[metric] * 100 : 0;
                }),
                backgroundColor: 'rgba(67, 160, 71, 0.8)',
                borderColor: 'rgb(67, 160, 71)',
                borderWidth: 2
            });

            // Transformed performance (vs GT)
            datasets.push({
                label: 'Transformed (vs GT)',
                data: MODELS.map(model => {
                    const data = transformedVsGtData[model][transform];
                    return data ? data[metric] * 100 : 0;
                }),
                backgroundColor: 'rgba(251, 140, 0, 0.8)',
                borderColor: 'rgb(251, 140, 0)',
                borderWidth: 2
            });

            if (charts.originalVsTransformed) {
                charts.originalVsTransformed.destroy();
            }

            charts.originalVsTransformed = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: MODELS.map(m => m.toUpperCase()),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: `${metric} - ${transform}: Original vs Transformed Images`,
                            font: { size: 14, weight: '600' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        function updateComparisonChart(transform, metric) {
            const ctx = document.getElementById('comparisonChart');

            const data = {
                labels: MODELS.map(m => m.toUpperCase()),
                datasets: [{
                    label: metric,
                    data: MODELS.map(model => {
                        const modelData = allData[model][transform];
                        return modelData ? modelData[metric] * 100 : 0;
                    }),
                    backgroundColor: MODELS.map(model => MODEL_COLORS[model]),
                    borderRadius: 8,
                    borderWidth: 0
                }]
            };

            if (charts.comparison) {
                charts.comparison.destroy();
            }

            charts.comparison = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: `${metric} Comparison - ${transform}`,
                            font: { size: 14, weight: '600' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        function updatePrecisionChart(transform) {
            const ctx = document.getElementById('precisionChart');

            const precisionMetrics = ['AP', 'AP50', 'AP75'];

            const datasets = MODELS.map(model => ({
                label: model.toUpperCase(),
                data: precisionMetrics.map(metric => {
                    const modelData = allData[model][transform];
                    return modelData ? modelData[metric] * 100 : 0;
                }),
                backgroundColor: MODEL_COLORS[model],
                borderRadius: 8,
                borderWidth: 0
            }));

            if (charts.precision) {
                charts.precision.destroy();
            }

            charts.precision = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: precisionMetrics,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        function updateRadarChart(transform) {
            const ctx = document.getElementById('radarChart');

            const radarMetrics = ['AP', 'AP50', 'AP75', 'AR10', 'AR100'];

            const datasets = MODELS.map(model => ({
                label: model.toUpperCase(),
                data: radarMetrics.map(metric => {
                    const modelData = allData[model][transform];
                    return modelData ? modelData[metric] * 100 : 0;
                }),
                borderColor: MODEL_COLORS[model],
                backgroundColor: MODEL_COLORS[model] + '20',
                borderWidth: 2,
                pointBackgroundColor: MODEL_COLORS[model],
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: MODEL_COLORS[model]
            }));

            if (charts.radar) {
                charts.radar.destroy();
            }

            charts.radar = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: radarMetrics,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    },
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20,
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        function updateAllTransformsChart(metric) {
            const ctx = document.getElementById('allTransformsChart');

            const datasets = MODELS.map(model => ({
                label: model.toUpperCase(),
                data: TRANSFORMATIONS.map(transform => {
                    const modelData = allData[model][transform];
                    return modelData ? modelData[metric] * 100 : 0;
                }),
                borderColor: MODEL_COLORS[model],
                backgroundColor: MODEL_COLORS[model],
                borderWidth: 2,
                tension: 0.3
            }));

            if (charts.allTransforms) {
                charts.allTransforms.destroy();
            }

            // Helper function to format transformation names
            const formatTransformName = (t) => {
                if (t.startsWith('img')) {
                    return t.replace('img', '');
                } else if (t.startsWith('labelRemove_')) {
                    return 'Label-' + t.replace('labelRemove_', '');
                }
                return t;
            };

            charts.allTransforms = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: TRANSFORMATIONS.map(formatTransformName),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: `${metric} Across All Transformations`,
                            font: { size: 14, weight: '600' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        function updateTable(transform) {
            const table = document.getElementById('comparisonTable');

            let html = '<thead><tr><th rowspan="2">Metric</th>';
            MODELS.forEach(model => {
                html += `<th colspan="3" style="text-align: center; border-bottom: 2px solid rgba(255,255,255,0.3);">${model.toUpperCase()}</th>`;
            });
            html += '</tr><tr>';
            MODELS.forEach(() => {
                html += '<th style="font-size: 0.85em;">Original</th>';
                html += '<th style="font-size: 0.85em;">Transformed</th>';
                html += '<th style="font-size: 0.85em;">Drop</th>';
            });
            html += '</tr></thead><tbody>';

            METRICS.forEach(metric => {
                html += `<tr><td><strong>${metric}</strong></td>`;

                MODELS.forEach(model => {
                    const origData = originalVsGtData[model];
                    const transData = transformedVsGtData[model][transform];

                    const origVal = origData ? origData[metric] : 0;
                    const transVal = transData ? transData[metric] : 0;
                    const drop = (origVal - transVal) * 100;

                    // Original value
                    html += `<td style="background-color: rgba(67, 160, 71, 0.1);">${(origVal * 100).toFixed(2)}%</td>`;

                    // Transformed value
                    html += `<td style="background-color: rgba(251, 140, 0, 0.1);">${(transVal * 100).toFixed(2)}%</td>`;

                    // Drop value
                    const dropColor = drop > 5 ? 'rgba(229, 57, 53, 0.2)' :
                                     drop > 2 ? 'rgba(251, 140, 0, 0.2)' :
                                     'rgba(67, 160, 71, 0.1)';
                    html += `<td style="background-color: ${dropColor}; font-weight: ${drop > 5 ? 'bold' : 'normal'};">${drop > 0 ? '-' : '+'}${Math.abs(drop).toFixed(2)}%</td>`;
                });

                html += '</tr>';
            });

            html += '</tbody>';
            table.innerHTML = html;
        }

        // Event listeners
        document.getElementById('transformSelect').addEventListener('change', updateDashboard);
        document.getElementById('metricSelect').addEventListener('change', updateDashboard);
        document.getElementById('viewSelect').addEventListener('change', updateDashboard);

        // Initialize
        loadAllData();
    </script>
</body>
</html>
